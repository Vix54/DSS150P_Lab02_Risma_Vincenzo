source_name: "products"
source_type: "Parquet file"
location_or_endpoint: "data/products.parquet"
owner: "Vincenzo Risma"
description: "Product catalog with pricing, stock levels, and physical attributes; schema embedded natively in the file."
record_count: 200
schema:
  - name: product_id
    type: string
  - name: product_name
    type: string
  - name: category
    type: string (categorical)
  - name: brand
    type: string
  - name: unit_price
    type: float64
  - name: stock_quantity
    type: int32
  - name: weight_kg
    type: float64
primary_or_candidate_key: product_id
update_pattern: "Full file replacement, static snapshot"
known_quality_issues:
  - "No missing values across any column"
  - "File size (14,652 bytes) larger than the equivalent CSV (11,560 bytes) at this row count; Parquet's compression advantage did not offset its metadata overhead at only 200 rows"
acquisition_method: "File copy with SHA-256 manifest into raw area"
validation_checks:
  - "product_id must be non-null and unique"
  - "unit_price and stock_quantity must be non-negative"
  - "category must be one of a known enumerated set"
source_name: "customers"
source_type: "CSV file"
location_or_endpoint: "data/customers.csv"
owner: "Vincenzo Luis S. Risma"
description: "Customer master data including identity, contact, location, signup date, and segment classification."
record_count: 250
schema:
  - name: customer_id
    type: string
  - name: first_name
    type: string
  - name: last_name
    type: string
  - name: email
    type: string
  - name: city
    type: string
  - name: signup_date
    type: string (ISO date)
  - name: customer_segment
    type: string (categorical)
primary_or_candidate_key: customer_id
update_pattern: "Full file replacement, static snapshot; no incremental update mechanism observed"
known_quality_issues:
  - "3 duplicate customer_id values among 250 rows (6 rows affected); 2 are exact re-ingested duplicates (C0036, C0145), 1 is a genuine ID collision between two distinct customers (C0090)"
  - "email missing in 3 rows (1.2%)"
  - "city missing in 2 rows (0.8%)"
  - "4 full exact-row duplicates found"
acquisition_method: "File copy with SHA-256 manifest into raw area"
validation_checks:
  - "customer_id must be non-null and unique"
  - "email must match valid email format when present"
  - "signup_date must parse as valid ISO date, not in the future"
  - "customer_segment must be one of: Professional, Retail, SME, Student"